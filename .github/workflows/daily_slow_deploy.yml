name: Daily WizzTour Slow (Barrier-Free & Senior Travel) Auto Deploy

on:
  schedule:
    # 매일 한국시간(KST) 오전 07:40 (UTC 22:40) 자동 실행 — 타 사이트와 시간 분산
    - cron: '40 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build WizzTour Slow Static Pages (index.html, posts/*.html, sitemap.xml)
        env:
          SITE_BASE_URL: https://slow.wizztour.com
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python slow_wizztour_bot.py --build-once

      - name: Commit and Push updated static files (triggers Cloudflare Pages deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html posts/ sitemap.xml rss.xml robots.txt CNAME
          git diff --staged --quiet || (git commit -m "chore(slow): auto-update barrier-free travel guides & hotel comparisons" && git push)

